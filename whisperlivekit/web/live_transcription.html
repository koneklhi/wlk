<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhisperLiveKit</title>
    <link rel="stylesheet" href="live_transcription.css" />
</head>

<body>
    <div class="header-container">
        <div class="settings-container">
            <div class="buttons-container">
                <button id="startButton" class="record-control record-control--start" title="녹음 시작">
                    <span class="record-control-icon">▶</span>
                    <span class="record-control-label">시작</span>
                </button>
                <button id="pauseButton" class="record-control record-control--pause" title="일시 중단" disabled>
                    <span class="record-control-icon">⏸</span>
                    <span class="record-control-label">일시중단</span>
                </button>
                <button id="stopButton" class="record-control record-control--stop" title="완전 중단" disabled>
                    <span class="record-control-icon">⏹</span>
                    <span class="record-control-label">완전중단</span>
                </button>
                <div class="recording-info" id="recordingInfo">
                    <div class="wave-container">
                        <canvas id="waveCanvas"></canvas>
                    </div>
                    <div class="timer">00:00</div>
                </div>

                <button id="saveTranscriptButton" class="settings-toggle" title="전사 저장" disabled>
                    <img src="web/src/save.svg" alt="Save" />
                </button>

                <button id="settingsToggle" class="settings-toggle" title="Show/hide settings">
                    <img src="web/src/settings.svg" alt="Settings" />
                </button>
            </div>

            <div class="settings">
                <div class="field">
                    <label for="websocketInput">Websocket URL</label>
                    <input id="websocketInput" type="text" placeholder="ws://host:port/asr" />
                </div>

                <div class="field">
                    <label id="microphoneSelectLabel" for="microphoneSelect">Select Microphone</label>
                    <select id="microphoneSelect">
                        <option value="">Default Microphone</option>
                    </select>
                </div>

                <div class="field">
                    <label id="languageSelectLabel" for="languageSelect">Source Language</label>
                    <select id="languageSelect">
                        <option value="auto">자동 (Auto)</option>
                        <option value="ko">한국어 (Korean)</option>
                        <option value="en">English</option>
                    </select>
                </div>

                <div class="theme-selector-container">
                    <div class="segmented" role="radiogroup" aria-label="Theme selector">
                        <input type="radio" id="theme-system" name="theme" value="system" />
                        <label for="theme-system" title="System">
                            <img src="/web/src/system_mode.svg" alt="" />
                            <span>System</span>
                        </label>

                        <input type="radio" id="theme-light" name="theme" value="light" />
                        <label for="theme-light" title="Light">
                            <img src="/web/src/light_mode.svg" alt="" />
                            <span>Light</span>
                        </label>

                        <input type="radio" id="theme-dark" name="theme" value="dark" />
                        <label for="theme-dark" title="Dark">
                            <img src="/web/src/dark_mode.svg" alt="" />
                            <span>Dark</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
        
        <p id="status"></p>
    </div>

    <div class="transcript-container">
        <div id="linesTranscript"></div>
    </div>

    <script src="live_transcription.js"></script>
</body>

</html>
